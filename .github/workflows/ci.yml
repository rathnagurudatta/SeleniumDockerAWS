# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Selenium Test Pipeline

on:
  schedule:
    - cron: '00 18 * * *'

  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: |
          java -version
          mvn -version
          google-chrome --version

          mvn clean test \
            -Dbrowser=chrome \
            -DisLambdaTest=false \
            -DisHeadless=true

      - name: Archive Logs
        if: always()   # This ensures logs are saved even if the tests fail
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: logs/

      - name: Archive screenshots
        if: always()   # This ensures logs are saved even if the tests fail
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Archive Extent Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports
          path: reports.html

      - name: Copy Report to gh-pages Folder
        if: always()
        run: |
          mkdir -p public/extent-reports
          cp -R reports.html public/extent-reports/
          if [ -d screenshots ]; then
          cp -R screenshots public/extent-reports/
          fi
          ls -R public/   

      - name: Deploy
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public/extent-reports/
          token: ${{ secrets.PAT_FORAPP }}
          clean: true


